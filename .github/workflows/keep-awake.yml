# Render's free plan sleeps after 15 minutes without visitors, and Supabase pauses
# free projects after a week without activity. This pings the site during college
# hours so pages open instantly. Set the repository variable SITE_URL
# (Settings -> Secrets and variables -> Actions -> Variables) to enable it.
name: Keep site awake

on:
  schedule:
    # Every 10 minutes from 07:00 to 22:59 IST (01:30–17:30 UTC)
    - cron: "*/10 1-17 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SITE_URL != '' }}
    steps:
      - name: Ping
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.SITE_URL }}/healthz"
